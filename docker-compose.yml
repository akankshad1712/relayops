services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relayops
      POSTGRES_PASSWORD: relayops_local
      POSTGRES_DB: relayops
    ports:
      - "5432:5432"
    volumes:
      - relayops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayops -d relayops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  relayops_pgdata:
